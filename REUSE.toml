version = 1
SPDX-PackageName = "groundlens"
SPDX-PackageSupplier = "Javier Marín <javier@jmarin.info>"
SPDX-PackageDownloadLocation = "https://github.com/groundlens-dev/groundlens"

# Source files carry their own SPDX header. Everything that cannot (data,
