name: docs

# A fast smoke build of the Sphinx documentation. It runs only when the docs,
# the README or the Read the Docs config change, so a docs-only pull request is
# not held up by the Rust and Python test matrices. Read the Docs builds and
# publishes the site separately, from its own webhook.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".readthedocs.yaml"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".readthedocs.yaml"
      - "README.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: python -m sphinx -b html --keep-going docs docs/_build/html
