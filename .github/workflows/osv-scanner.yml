name: osv-scanner

# Dependency vulnerability scanning. The core package has zero runtime
# dependencies, so this should stay quiet -- and a scanner that stays quiet for
# a real reason is worth more than one that is absent.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "24 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67" # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./
