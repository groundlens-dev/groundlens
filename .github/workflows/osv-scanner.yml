# A workflow that runs OSV-Scanner for vulnerabilities, plus a PR check.
# See https://google.github.io/osv-scanner/github-action/

name: OSV-Scanner

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  schedule:
    - cron: '33 18 * * 5'
  push:
    branches: [ "main" ]

# Least privilege at the top; each scan job elevates only what it needs.
permissions:
  contents: read

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      security-events: write   # upload the SARIF to the security tab
      contents: read
      actions: read            # required by osv-scanner-reusable v2
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8"
    with:
      scan-args: |-
        -r
        --skip-git
        ./
  scan-pr:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8"
    with:
      scan-args: |-
        -r
        --skip-git
        ./
