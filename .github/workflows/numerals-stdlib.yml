name: numerals-stdlib

# The numeral path is the whole product: a number is equal or it is wrong.
# It must depend on nothing but the standard library, and the answer must not
# change with the shell that launched the process.
#
# Both are asserted here as builds that fail, not as sentences in a docstring
# that nobody rechecks.

on:
  push:
    branches: [main, "v3*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hostile-locales:
    strategy:
      fail-fast: false
      matrix:
        # tr_TR is the casefolding trap: Turkish dotless i breaks naive
        # lower()-based stopword matching. de_DE and en_US disagree about what a
        # comma in a number means, which is the entire ambiguity problem.
        locale: ["C", "tr_TR.UTF-8", "de_DE.UTF-8", "en_US.UTF-8"]
    runs-on: ubuntu-latest
    env:
      LC_ALL: ${{ matrix.locale }}
      LANG: ${{ matrix.locale }}
      PYTHONHASHSEED: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: generate locales
        run: sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8 en_US.UTF-8 && sudo update-locale
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_numerals.py tests/test_words.py tests/test_determinism.py
      - name: the answer must come from the argument, not the environment
        run: |
          python - <<'PY'
          from decimal import Decimal
          from groundlens._numerals import find_numerals, locale
          assert find_numerals("1,234", locale("en"))[0].readings == (Decimal("1234"),)
          assert find_numerals("1,234", locale("es"))[0].readings == (Decimal("1.234"),)
          print("ok: locale comes from the argument")
          PY

  stdlib-only:
    # Not "install pytest and nothing else" -- pytest has its own dependencies
    # and starving it just breaks pytest. Instead: import the numeral path in a
    # clean interpreter and assert nothing outside the standard library was
    # loaded to do it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: no third-party import reachable from the deterministic path
        run: |
          python - <<'PY'
          import sys
          # No -S here. Disabling site processing takes site-packages off the
          # path, so an editable install becomes invisible and the check fails
          # for the wrong reason. Snapshotting sys.modules before the import is
          # what makes this meaningful: anything the interpreter loaded at
          # startup is already in `before` and cannot be mistaken for a leak.
          before = set(sys.modules)
          import groundlens
          from groundlens import _align, _hash, _numerals, _text, _types, _words  # noqa: F401
          from groundlens import calibrate, proofread  # noqa: F401

          stdlib = set(getattr(sys, "stdlib_module_names", ()))
          leaked = sorted(
              name for name in set(sys.modules) - before
              if not name.startswith(("groundlens", "_")) and "." not in name
              and name not in stdlib
          )
          assert not leaked, f"deterministic path pulled third-party modules: {leaked}"
          print("ok: stdlib only —", groundlens.__version__)
          PY
