name: numerals-stdlib

# The numeral path is the whole product: a number is equal or it is wrong.
# It must depend on nothing but the standard library. This job installs pytest
# and NOTHING ELSE, so "stdlib only" is a build that fails rather than a
# sentence in a docstring that nobody re-checks.

on:
  push:
    branches: [main, "v3*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-only:
    strategy:
      fail-fast: false
      matrix:
        # tr_TR is the casefolding trap: Turkish dotless i breaks naive
        # lower()-based stopword matching. de_DE and en_US disagree about what
        # a comma means in a number, which is the whole ambiguity problem.
        locale: ["C", "tr_TR.UTF-8", "de_DE.UTF-8", "en_US.UTF-8"]
    runs-on: ubuntu-latest
    env:
      LC_ALL: ${{ matrix.locale }}
      LANG: ${{ matrix.locale }}
      PYTHONHASHSEED: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: generate locales
        run: |
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8 en_US.UTF-8 || true
          sudo update-locale || true
      - name: install pytest and nothing else
        run: |
          pip install --no-deps pytest pluggy iniconfig packaging
          pip install --no-deps -e .
      - run: pytest tests/test_numerals.py tests/test_words.py -q
      - name: the answer must not depend on the shell that launched us
        run: |
          python - <<'PY'
          from decimal import Decimal
          from groundlens._numerals import find_numerals, locale
          # Under LC_ALL=de_DE a locale-aware parser would read this as 1234.
          assert find_numerals("1,234", locale("en"))[0].readings == (Decimal("1234"),)
          assert find_numerals("1,234", locale("es"))[0].readings == (Decimal("1.234"),)
          print("ok: locale comes from the argument, not the environment")
          PY
