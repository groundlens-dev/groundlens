name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy src/groundlens/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -m "not slow" --cov --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  golden:
    # The only job that loads the real default encoder and asserts a real
    # number. Everything above mocks the embedding layer or asserts a
    # property that survives swapping the encoder underneath it, which is how
    # two silent default-encoder changes reached a release.
    name: Golden scores (real encoder)
    runs-on: ubuntu-latest
    needs: lint
    # One recalibration of the DGI reference direction embeds all 212
    # reference pairs -- 424 texts through sentence-t5-large -- and takes
    # 7m43s on this runner. The test file now does exactly one, so the job
    # runs in about 11 minutes cold. 20 leaves room for a slow runner and
    # still fails fast if the count of recalibrations ever creeps back up.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # restore/save rather than the combined action: the combined one only
      # writes the cache when the job succeeds. While this job was timing out
      # that meant the encoder was re-downloaded on every run and the cache
      # key stayed empty forever, which is a loop that cannot break itself.
      - name: Restore HuggingFace cache
        id: hf-cache
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-sentence-t5-large-v1
          restore-keys: hf-${{ runner.os }}-

      # This job sets CUDA_VISIBLE_DEVICES="" and there is no GPU on the
      # runner, but the default index resolves torch to the CUDA build and
      # pulls ~2.5 GB of nvidia-* wheels to sit unused on disk. The CPU wheel
      # satisfies torch>=1.11.0 just the same.
      - name: Install dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Run golden score regressions
        env:
          # CPU only; no GPU on the runner and none needed.
          CUDA_VISIBLE_DEVICES: ""
          TOKENIZERS_PARALLELISM: "false"
        run: pytest tests/integration/test_golden_scores.py -v --durations=0

      - name: Save HuggingFace cache
        if: always() && steps.hf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-sentence-t5-large-v1
