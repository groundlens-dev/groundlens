name: release

# Cutting a release produces four things, and Scorecard's Signed-Releases check
# wants the last three of them:
#
#   1. sdist + wheel, built once and reused everywhere downstream
#   2. Sigstore bundles (.sigstore.json) proving who built them
#   3. SLSA level 3 provenance (multiple.intoto.jsonl) proving how
#   4. a PyPI upload with attestations, via Trusted Publishing — no API token
#
# Everything after the build consumes the *same* artifact. Rebuilding between
# signing and publishing would sign one file and ship another, which is the
# failure this whole apparatus exists to prevent.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: the tag must match the version in the package
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          ref = os.environ["GITHUB_REF_NAME"]
          init = pathlib.Path("src/groundlens/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', init).group(1)
          if ref.lstrip("v") != version:
              sys.exit(f"tag {ref} does not match __version__ {version}")
          print(f"ok: {ref} == {version}")
          PY

      - run: pip install build
      - run: python -m build

      - name: the wheel must import with no dependencies
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --no-deps dist/*.whl
          /tmp/clean/bin/python -c "import groundlens; print(groundlens.__version__)"

      - name: base64 subjects for the provenance generator
        id: hash
        run: echo "hashes=$(sha256sum dist/* | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # `gh release upload` and the SLSA generator both write assets INTO a
  # release. A tag push does not create one. This job does, once, before
  # either of them runs.
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: create the release for this tag if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" \
                 --title "${GITHUB_REF_NAME}" --generate-notes

  # SLSA 3 provenance. This is the reusable workflow that produced the
  # multiple.intoto.jsonl on the earlier releases; it must be called by tag,
  # not by SHA, or the generator refuses to run.
  provenance:
    needs: [build, create-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  sign:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          upload-signing-artifacts: true
      - name: attach artifacts and signatures to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  pypi:
    needs: [build, sign]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: remove signature files before upload
        run: rm -f dist/*.sigstore dist/*.sigstore.json dist/*.crt dist/*.sig
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
