name: release

# A tag `vX.Y.Z` is the release: wheels for Linux, macOS and Windows, an
# sdist, the glv binaries, PyPI (trusted publishing), the Rust crates on
# crates.io (trusted publishing), the MCP registry entry and a GitHub Release.
# Nothing is published by hand and no token is stored anywhere.
# The tag must equal the version in python/pyproject.toml and Cargo.toml.
# Every wheel, the sdist and every glv binary gets SLSA Build Level 3
# provenance: the OpenSSF generator signs it in its own isolated job, which
# the build steps cannot reach, and it rides on the GitHub Release as
# `groundlens-vX.Y.Z.intoto.jsonl`. Verify any of those files with
#   slsa-verifier verify-artifact <file> \
#     --provenance-path groundlens-vX.Y.Z.intoto.jsonl \
#     --source-uri github.com/groundlens-dev/groundlens --source-tag vX.Y.Z
# Each file also carries a GitHub build attestation, checked with
#   gh attestation verify <file> --repo groundlens-dev/groundlens
# and every binary on the release a sigstore keyless signature (`.sig` +
# `.pem`). Verify one with
#   cosign verify-blob --certificate glv-... .pem --signature glv-... .sig \
#     --certificate-identity-regexp 'https://github.com/groundlens-dev/groundlens/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com  glv-...

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(grep -m1 '^version' python/pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          rs=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$tag pyproject=$py cargo=$rs"
          test "$tag" = "$py" && test "$tag" = "$rs"

  wheels:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out ../dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: "true"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: python
          command: sdist
          args: --out ../dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist

  glv:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: glv-linux-x86_64
          - os: macos-14
            name: glv-macos-arm64
          - os: windows-latest
            name: glv-windows-x64.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned on purpose: a new Rust release can add lints that break the build
          # with no code change. Raise it in its own pull request.
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release -p groundlens-cli
      - shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then cp target/release/glv.exe "out/${{ matrix.name }}"; else cp target/release/glv "out/${{ matrix.name }}"; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "out/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist

  # SHA-256 of every file the release ships, the subjects of the SLSA provenance.
  hashes:
    needs: [wheels, sdist, glv]
    runs-on: ubuntu-latest
    outputs:
      subjects: ${{ steps.hash.outputs.subjects }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - id: hash
        working-directory: release
        run: |
          set -euo pipefail
          sha256sum * | tee /dev/stderr > ../SHA256SUMS
          echo "subjects=$(base64 -w0 ../SHA256SUMS)" >> "$GITHUB_OUTPUT"

  # SLSA Build Level 3 provenance, generated and signed by the OpenSSF reusable
  # workflow in jobs of its own. It must be referenced by tag, not by commit:
  # slsa-verifier checks the tag of the builder that signed the provenance.
  provenance:
    needs: hashes
    permissions:
      actions: read     # read the path of this workflow
      id-token: write   # sign the provenance with sigstore
      contents: write   # required by the generator, which does not upload here
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.hashes.outputs.subjects }}
      provenance-name: groundlens-${{ github.ref_name }}.intoto.jsonl
      upload-assets: false

  github-release:
    needs: [pypi, glv, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # keyless sigstore signing and provenance OIDC
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "glv-*"
          merge-multiple: true
          path: bin
      # The SLSA provenance of every wheel, the sdist and every binary rides on
      # the release (Scorecard's Signed-Releases check reads it there).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: bin
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign 3.x defaults to the new bundle format and drops the detached
          # .sig/.pem output Scorecard's Signed-Releases check looks for; pin v2.
          cosign-release: v2.6.5
      - name: Sign each binary with sigstore (keyless)
        shell: bash
        run: |
          shopt -s nullglob
          for f in bin/*; do
            case "$f" in
              *.sig|*.pem|*.intoto.jsonl) continue ;;  # never sign a signature or the provenance
            esac
            cosign sign-blob --yes \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem" \
              "$f"
          done
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bin/* --repo "$GITHUB_REPOSITORY" \
            --title "groundlens $GITHUB_REF_NAME" --generate-notes

  # The ten crates, in dependency order, through crates.io trusted publishing:
  # the job exchanges its GitHub OIDC token for a crates.io token that lives
  # for this job only. Each crate must list this repository, this workflow and
  # the `crates-io` environment under Settings → Trusted Publishing on
  # crates.io. A crate already at this version is skipped, so a rerun after a
  # partial failure picks up where it stopped.
  crates:
    needs: pypi
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for c in groundlens-core groundlens-text groundlens-numeric groundlens-policy groundlens-runtime \
                   groundlens-mcp groundlens-verifiers groundlens-record groundlens groundlens-cli; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "groundlens-release (github.com/groundlens-dev/groundlens)" \
              "https://crates.io/api/v1/crates/$c/$version")
            if [ "$code" = 200 ]; then echo "$c $version already on crates.io"; continue; fi
            cargo publish -p "$c" --locked
          done

  # The Claude plugin (plugins/groundlens) runs `uvx --from groundlens[mcp]==X.Y.Z`
  # and ships a uv.lock of that version, so it can only move once PyPI serves the
  # release. This job pins the new version, regenerates the lock and opens a pull
  # request; Anthropic's directory picks the plugin up from main after the merge.
  # Needs Settings → Actions → General → "Allow GitHub Actions to create and approve
  # pull requests".
  claude-plugin:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the branch
      pull-requests: write   # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Wait until PyPI serves the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/groundlens/$version/json" > /dev/null && exit 0
            sleep 10
          done
          echo "PyPI does not serve groundlens $version yet" && exit 1
      - name: Pin the plugin and regenerate its lock
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/bump_claude_plugin.py "$version"
          cd plugins/groundlens && uv lock --refresh-package groundlens
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if git diff --quiet; then echo "plugin already at $version"; exit 0; fi
          branch="release/claude-plugin-$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add plugins/groundlens
          git commit -m "plugin: GroundLens $version for Claude" \
            -m "Pins uvx --from groundlens[mcp]==$version in plugin.json and pyproject.toml, and regenerates uv.lock."
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Claude plugin: GroundLens $version" \
            --body "Opened by the release workflow after PyPI published groundlens $version. Pins the plugin's MCP server to this version and regenerates \`plugins/groundlens/uv.lock\`. Merge it and Anthropic's directory picks up the new version from main."

  # The MCP registry entry (server.json) points at the PyPI package, so it is
  # published after PyPI has the version. GitHub OIDC proves the run belongs
  # to groundlens-dev, which owns the io.github.groundlens-dev/* namespace.
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher v1.8.1 (checksum pinned)
        run: |
          curl -sSfL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Wait until PyPI serves the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/groundlens/$version/json" > /dev/null && exit 0
            sleep 10
          done
          echo "PyPI does not serve groundlens $version yet" && exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
