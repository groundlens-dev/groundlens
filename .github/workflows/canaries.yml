name: Canaries

# A hard binary gate, deliberately separate from the coverage floor in ci.yml.
#
# Coverage asks whether the lines ran. This asks whether the checker still
# catches the defects it claims to catch, and — the number that actually
# decides whether anyone deploys it — how often it escalates an answer that
# has nothing wrong with it. Those two questions fail independently, so they
# get two jobs, and neither is allowed to mask the other.
#
# One dev-suite failure fails the build. There is no threshold, no percentage
# of cases allowed to fail and no soft mode, because a gate with a dial on it
# is a gate that gets turned down on the Friday before a release.
#
# The frozen suite runs on release tags only and never sets the exit status.
# It was authored from the defect-class definitions before the rule bodies
# were read, and gating on it would create exactly the pressure to tune
# against it that it exists to prevent.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: canaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canaries:
    name: Canaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The control path is pyyaml and nothing else. Installing the bare
      # package here, rather than the dev extra, also proves that the canary
      # runner does not quietly depend on numpy or sentence-transformers.
      - name: Install the control path only
        run: pip install -e .

      - name: Run the dev canary suite
        run: groundlens canaries --suite dev

  frozen:
    name: Canaries (frozen, report only)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install the control path only
        run: pip install -e .

      # Reports numbers, never gates. `groundlens canaries --suite frozen`
      # exits 0 whatever it finds; the numbers are for the release notes and
      # for whoever has to decide whether this build should ship.
      - name: Run the frozen canary suite
        run: groundlens canaries --suite frozen | tee frozen-canaries.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-canary-report
          path: frozen-canaries.txt
