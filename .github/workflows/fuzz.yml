name: fuzz

# ClusterFuzzLite. Ten minutes of fuzzing on every pull request against the
# numeral parser, which is a regex reading untrusted text. The ReDoS bound in
# NUMBER_PATTERN is a claim; this is what tests it.

on:
  pull_request:
    paths:
      - "src/groundlens/_numerals.py"
      - "src/groundlens/_text.py"
      - "src/groundlens/_words.py"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address

  run:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address
      - name: run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: "code-change"
          sanitizer: address
          output-sarif: true
