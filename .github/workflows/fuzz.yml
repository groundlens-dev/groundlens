name: fuzz

# cargo-fuzz over the parsers that read untrusted text: numerals,
# quantities, normalisation, policy YAML and the exact verifier. Short runs
# on every pull request that touches them, a longer run weekly.

on:
  pull_request:
    paths: ["crates/gl-text/**", "crates/gl-numeric/**", "crates/gl-policy/**", "crates/gl-verifiers/**", "fuzz/**"]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [numerals, quantities, normalise, policy, numeric_verifier]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: run ${{ matrix.target }}
        run: |
          seconds=$([ "${{ github.event_name }}" = "schedule" ] && echo 600 || echo 90)
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=$seconds -max_len=4096
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
