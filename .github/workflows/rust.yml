name: rust

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".readthedocs.yaml"
      - "CITATION.cff"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".readthedocs.yaml"
      - "CITATION.cff"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Pinned on purpose: a new Rust release can add lints that break the build
          # with no code change. Raise it in its own pull request.
          toolchain: "1.99.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Hostile environment: nothing here may change a byte of output.
      - run: cargo test --workspace
        env:
          LC_ALL: tr_TR.UTF-8
          LANG: tr_TR.UTF-8
          TZ: Pacific/Kiritimati

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --all-targets

  no-network-in-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Pinned on purpose: a new Rust release can add lints that break the build
          # with no code change. Raise it in its own pull request.
          toolchain: "1.99.0"
      - name: no crate in the workspace may open a network connection
        run: |
          cargo tree --workspace -e normal \
            | grep -Ei 'reqwest|hyper|ureq|curl|openssl|rustls|native-tls|tokio-tungstenite|hf-hub' && exit 1 || echo "clean"

  # cargo-deny (deny.toml): no networking crate, only the licences listed,
  # no crate with a RustSec advisory, no yanked crate. The binary is the
  # release archive, pinned by its SHA-256.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install cargo-deny 0.20.2
        run: |
          v=0.20.2
          curl -sSfL -o deny.tgz "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/cargo-deny-$v-x86_64-unknown-linux-musl.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  deny.tgz" | sha256sum -c -
          tar xzf deny.tgz --strip-components=1 -C "$HOME/.cargo/bin" "cargo-deny-$v-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo deny check

  # Licensing: every file carries SPDX copyright and licence information
  # (REUSE specification 3.3), so the bill of materials of a release is
  # complete without reading the source.
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
