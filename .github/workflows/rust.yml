name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Hostile environment: nothing here may change a byte of output.
      - run: cargo test --workspace
        env:
          LC_ALL: tr_TR.UTF-8
          LANG: tr_TR.UTF-8
          TZ: Pacific/Kiritimati

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --workspace --all-targets

  no-network-in-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - name: the engine crates must not depend on any HTTP or TLS crate
        run: |
          cargo tree -p gl-core -p gl-text -p gl-numeric -p gl-verifiers -p gl-policy -p gl-record -p gl-bundle -p gl-onnx -p gl-engine -p gl-python --features gl-onnx/runtime -e normal \
            | grep -Ei 'reqwest|hyper|ureq|curl|openssl|rustls|native-tls|tokio-tungstenite|hf-hub' && exit 1 || echo "clean"
