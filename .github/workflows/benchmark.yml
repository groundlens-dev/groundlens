name: Weekly Benchmark

on:
  schedule:
    - cron: "0 0 * * 0"   # Sunday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Confabulation Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache HuggingFace models and datasets
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-bench-${{ runner.os }}-v1
          restore-keys: hf-bench-${{ runner.os }}-

      # The benchmark scripts import sklearn.metrics and datasets. Neither was
      # in any extra, so `pip install -e ".[dev]"` produced a run that died on
      # `import sklearn` before it scored anything.
      - name: Install dependencies
        run: pip install -e ".[dev,benchmark]"

      - name: Run benchmark
        env:
          CUDA_VISIBLE_DEVICES: ""
          TOKENIZERS_PARALLELISM: "false"
        run: python benchmarks/confabulation_benchmark.py --output benchmarks/results

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 90
