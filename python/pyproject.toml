[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "groundlens"
version = "5.3.0"
description = "Guardrails for LLM answers: checks an answer against its sources without a model, decides PASS, REVIEW or FAIL under your policy, and keeps a signed record."
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Javier Marin", email = "javier@jmarin.info" }]
keywords = ["llm", "guardrails", "rag", "llm-as-a-judge", "hallucination", "verification", "audit-trail", "eu-ai-act", "langfuse", "opentelemetry", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Typing :: Typed",
]
# The package has NO runtime dependencies. A CI job fails the build if that changes.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# The MCP server. Opt-in, so the core keeps zero runtime dependencies.
mcp = ["mcp>=2,<3"]
# Connectors. Opt-in, like the MCP server.
otel = ["opentelemetry-api>=1.27,<2"]  # 1.27: histogram bucket advice
langfuse = ["langfuse>=3,<5"]

[project.scripts]
groundlens = "groundlens.cli:main"
groundlens-mcp = "groundlens.mcp:main"

[project.urls]
Homepage = "https://groundlens.dev"
Documentation = "https://groundlens.readthedocs.io"
Source = "https://github.com/groundlens-dev/groundlens"

[tool.maturin]
manifest-path = "../crates/gl-python/Cargo.toml"
python-source = "."
module-name = "groundlens._engine"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
