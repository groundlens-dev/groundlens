[workspace]
resolver = "2"
members = [
    "crates/gl-core",
    "crates/gl-text",
    "crates/gl-numeric",
    "crates/gl-verifiers",
    "crates/gl-policy",
    "crates/gl-record",
    "crates/gl-engine",
    "crates/gl-runtime",
    "crates/gl-mcp",
    "crates/gl-python",
    "crates/gl-cli",
]
# cargo-fuzz targets need nightly; kept out of the stable workspace build.
exclude = ["fuzz"]

[workspace.package]
version = "6.0.5"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/groundlens-dev/groundlens"
authors = ["Javier Marin <javier@jmarin.info>"]

[workspace.dependencies]
# On crates.io the crates are groundlens-* (the gl-* names belong to another project);
# inside the workspace they keep their short gl_* names. On a release, bump the
# version here together with [workspace.package].
gl-core = { package = "groundlens-core", path = "crates/gl-core", version = "6.0.5" }
gl-text = { package = "groundlens-text", path = "crates/gl-text", version = "6.0.5" }
gl-numeric = { package = "groundlens-numeric", path = "crates/gl-numeric", version = "6.0.5" }
gl-verifiers = { package = "groundlens-verifiers", path = "crates/gl-verifiers", version = "6.0.5" }
gl-policy = { package = "groundlens-policy", path = "crates/gl-policy", version = "6.0.5" }
gl-record = { package = "groundlens-record", path = "crates/gl-record", version = "6.0.5" }
gl-engine = { package = "groundlens", path = "crates/gl-engine", version = "6.0.5" }
gl-runtime = { package = "groundlens-runtime", path = "crates/gl-runtime", version = "6.0.5" }
gl-mcp = { package = "groundlens-mcp", path = "crates/gl-mcp", version = "6.0.5" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# serde_yaml is unmaintained (RUSTSEC-2024-0449, via unsafe-libyaml); serde_norway is
# its maintained fork with the same API, so the crates keep `use serde_yaml`.
serde_yaml = { package = "serde_norway", version = "0.9" }
rust_decimal = { version = "1", features = ["serde-with-str"] }
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "3", features = ["rand_core", "pem"] }
# ECDSA P-256 records: the curve AWS KMS, Azure Key Vault and most HSMs sign with.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
unicode-normalization = "0.1"
regex = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
