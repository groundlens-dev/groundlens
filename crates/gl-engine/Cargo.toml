[package]
name = "gl-engine"
description = "GLV, the GroundLens verification engine: one entry point that runs claims → verifiers → evidence → policy → decision → signed record"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["lexical", "nli", "semantic"]
# The lexical channel: tract + tokenizers, pure Rust. Off for builds that
# only need the exact and symbolic verifiers.
lexical = ["gl-verifiers/lexical", "dep:gl-onnx"]
# The entailment (NLI) channel: same pure-Rust model host as lexical. Runs
# only when the loaded bundle carries an entailment model.
nli = ["gl-verifiers/nli", "dep:gl-onnx"]
# The semantic (sentence-similarity) channel: shares the loaded encoder with
# the lexical channel. Runs whenever a bundle with an encoder is loaded.
semantic = ["gl-verifiers/semantic", "dep:gl-onnx"]

[dependencies]
gl-onnx = { workspace = true, optional = true, features = ["runtime"] }
gl-numeric.workspace = true
gl-core.workspace = true
gl-text.workspace = true
gl-verifiers.workspace = true
gl-policy.workspace = true
gl-record.workspace = true
gl-runtime.workspace = true
gl-mcp.workspace = true
gl-bundle.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
hex.workspace = true
rand_core.workspace = true
indexmap.workspace = true

[dev-dependencies]
serde_json.workspace = true
