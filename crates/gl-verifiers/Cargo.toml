[package]
name = "gl-verifiers"
description = "Built-in verifiers for the Groundlens engine: numeric (exact), rules (symbolic), and the claim extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# The lexical channel needs an encoder: pulls gl-onnx with tract.
lexical = ["dep:gl-onnx"]

[dependencies]
gl-core.workspace = true
gl-onnx = { workspace = true, optional = true, features = ["runtime"] }
gl-text.workspace = true
gl-numeric.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
rust_decimal.workspace = true
indexmap.workspace = true
