[package]
name = "gl-onnx"
description = "Model host (tract, pure Rust ONNX inference) and tokenizers for the lexical, ML and geometric verifiers of the GroundLens engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Pulls tract (ONNX inference in pure Rust) and HF tokenizers with the
# pure-Rust regex backend. No native library anywhere.
runtime = ["dep:tract-onnx", "dep:tokenizers", "dep:gl-bundle"]

[dependencies]
gl-core.workspace = true
gl-bundle = { workspace = true, optional = true }
serde.workspace = true
tract-onnx = { version = "0.23", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }
