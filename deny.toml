# cargo-deny configuration. The engine is an offline artefact: no crate that
# can open a socket may enter the dependency graph of the core crates.
[bans]
multiple-versions = "warn"
deny = [
  { crate = "reqwest" },
  { crate = "hyper" },
  { crate = "ureq" },
  { crate = "curl" },
  { crate = "openssl" },
  { crate = "native-tls" },
]

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0"]

[advisories]
yanked = "deny"
