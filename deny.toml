# cargo-deny configuration, checked in CI (rust.yml, job "deny").
# GroundLens is an offline artefact: no crate that can open a socket may
# enter the dependency graph of any crate in the workspace.
[bans]
multiple-versions = "warn"
deny = [
  { crate = "reqwest" },
  { crate = "hyper" },
  { crate = "ureq" },
  { crate = "curl" },
  { crate = "openssl" },
  { crate = "native-tls" },
  { crate = "rustls" },
  { crate = "tokio-tungstenite" },
  { crate = "hf-hub" },
]

[licenses]
# Every licence the dependency graph uses today, and no other.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]

[advisories]
yanked = "deny"
