# Dev canaries for the decision-rationale pack.
#
# Every case carries the four attestation flags the pack's metadata_equals
# rules read (context_quality_validated, consistency_check_passed,
# audit_logged, injection_test_passed). Those rules are fail-closed by design:
# absent means fail, and there is no flag to turn that off. A caller who does
# not set them escalates every answer, clean or not, which is what the frozen
# suite shows and what a first-time integrator will hit.
#
# Setting them here is not tuning. They are inputs the pack documents that it
# requires, in the same way BNK-001 requires evidence. Withholding them would
# measure the caller's configuration, not the checker.
#
# Note the contrast with eu-retail-banking: this pack asserts all_facts_matched
# over every fact kind at fail severity, not only over currency. Its coverage
# of numbers and dates is therefore much better, and the dev numbers show it.

# ── clean ───────────────────────────────────────────────────────────────────

- id: dr-dev-clean-001
  defect_class: clean
  surface_form_distance: identical
  note: A short, entirely correct rationale.
  answer: >-
    The application was declined because the applicant's declared income of
    EUR 18.000,00 a year is below the EUR 24.000,00 minimum for this product.
  evidence:
    - id: credit-policy#p1
      text: Minimum declared income for this product is 24000,00 EUR a year.
    - id: application#p1
      text: The applicant declared an income of 18000,00 EUR a year.
  metadata:
    audit_logged: "true"
    consistency_check_passed: "true"
    context_quality_validated: "true"
    injection_test_passed: "true"
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

- id: dr-dev-clean-002
  defect_class: clean
  surface_form_distance: paraphrased
  note: >-
    A full reasoned rationale of the kind the legacy rule set was written for.
    If the ported lexicon rules escalated on wording this is the case they
    would clear and the short ones would not, so it is the reference point for
    the length question.
  answer: >-
    The recommendation is to decline the application.

    The applicant's declared income is EUR 18.000,00 a year, against a
    documented minimum of EUR 24.000,00 for this product. No sanctions or
    adverse media matches were returned, so the shortfall in income is the
    only factor against the application.

    We considered whether a smaller facility would fall within policy. It
    would not: the income minimum applies to the product and is not reduced in
    proportion to the amount advanced.

    This assessment is based only on the documents listed above.
  evidence:
    - id: credit-policy#p1
      text: Minimum declared income for this product is 24000,00 EUR a year.
    - id: credit-policy#p4
      text: >-
        The income minimum applies to the product and is not reduced in
        proportion to the amount advanced.
    - id: application#p1
      text: The applicant declared an income of 18000,00 EUR a year.
    - id: screening#p1
      text: >-
        Sanctions and adverse media screening returned no matches. No adverse
        credit history is recorded.
  metadata:
    audit_logged: "true"
    consistency_check_passed: "true"
    context_quality_validated: "true"
    injection_test_passed: "true"
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

