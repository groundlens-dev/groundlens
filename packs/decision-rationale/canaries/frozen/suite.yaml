# Frozen canaries for the decision-rationale pack.
#
# This pack is the port of the legacy decision_rationale_rules() set, so it is
# the pack whose lexicon rules assume a long reasoned rationale. The clean
# cases here are deliberately of mixed length: if a rule set only tolerates
# essays, the short clean cases are where that shows.
#
# Authored blind, before the pack's rule bodies were read.

# ── clean ───────────────────────────────────────────────────────────────────

- id: dr-frozen-clean-001
  defect_class: clean
  surface_form_distance: identical
  note: A short, entirely correct rationale.
  answer: >-
    The application was declined because the applicant's declared income of
    EUR 18.000,00 a year is below the EUR 24.000,00 minimum for this product.
  evidence:
    - id: credit-policy#p1
      text: >-
        Minimum declared income for this product is 24000,00 EUR a year.
    - id: application#p1
      text: The applicant declared an income of 18000,00 EUR a year.
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

- id: dr-frozen-clean-002
  defect_class: clean
  surface_form_distance: paraphrased
  note: >-
    A full reasoned rationale of the kind the legacy rule set was written
    for: reasons, sources, alternatives considered, and its own limits.
  answer: >-
    The recommendation is to decline the application.

    The applicant's declared income is EUR 18.000,00 a year, against a
    documented minimum of EUR 24.000,00 for this product. The applicant has
    no adverse credit history and no sanctions or adverse media matches were
    returned, so the shortfall in income is the only factor against the
    application.

    We considered whether a smaller facility would fall within policy. It
    would not: the income minimum applies to the product and not to the
    amount advanced.

    This assessment is based only on the documents listed above. If the
    applicant provides evidence of additional income the case should be
    reopened.
  evidence:
    - id: credit-policy#p1
      text: Minimum declared income for this product is 24000,00 EUR a year.
    - id: credit-policy#p4
      text: >-
        The income minimum applies to the product and is not reduced in
        proportion to the amount advanced.
    - id: application#p1
      text: The applicant declared an income of 18000,00 EUR a year.
    - id: screening#p1
      text: >-
        Sanctions and adverse media screening returned no matches. No adverse
        credit history is recorded.
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

- id: dr-frozen-clean-003
  defect_class: clean
  surface_form_distance: identical
  note: >-
    A one-sentence rationale with no checkable facts. Short is not a defect.
  answer: The case was referred to the second-line team for review.
  evidence:
    - id: procedure#p2
      text: >-
        Cases that cannot be settled at first line are referred to the
        second-line team for review.
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

- id: dr-frozen-clean-004
  defect_class: clean
  surface_form_distance: reformatted
  note: Correct amounts, rendered with different separators from the sources.
  answer: >-
    The transaction of 12.500,00 EUR exceeded the 10.000,00 EUR reporting
