- id: dr-frozen-polarity-flip-001
  defect_class: polarity_flip
  surface_form_distance: paraphrased
  note: >-
    may becoming must. The procedure permits requesting documents; the
    rationale states it as a requirement that was breached.
  answer: >-
    The reviewer must request further documents before signing off, and did
    not do so.
  evidence:
    - id: procedure#p5
      text: >-
        The reviewer may request further documents before sign-off. There is
        no requirement to do so.
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - fact.contradicted.obligation

