  evidence:
    - id: aml-policy#p1
      text: Transactions above 10000,00 EUR are reported.
    - id: transaction-log#p9
      text: Transaction value 12500,00 EUR. Reported on 2026-07-14.
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

- id: dr-frozen-clean-005
  defect_class: clean
  surface_form_distance: restructured
  note: >-
    The same reasoning as a bulleted list. Restructuring is not a defect.
  answer: >-
    Findings:

    - Sanctions screening: no matches.
    - Adverse media: no matches.
    - Declared income: EUR 18.000,00, below the EUR 24.000,00 minimum.

    Recommendation: decline, on income alone.
  evidence:
    - id: credit-policy#p1
      text: Minimum declared income for this product is 24000,00 EUR a year.
    - id: application#p1
      text: The applicant declared an income of 18000,00 EUR a year.
    - id: screening#p1
      text: Sanctions and adverse media screening returned no matches.
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

- id: dr-frozen-clean-006
  defect_class: clean
  surface_form_distance: paraphrased
  note: >-
    A permission stated as a permission, inside a rationale. Control for the
    polarity-flip class.
  answer: >-
    The reviewer may request further documents before signing off, but is not
    obliged to.
  evidence:
    - id: procedure#p5
      text: >-
        The reviewer may request further documents before sign-off. There is
        no requirement to do so.
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

