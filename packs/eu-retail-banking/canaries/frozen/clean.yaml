# Clean answers. Nothing is wrong with any of these.
#
# This is the most important file in the suite. Every escalation here is a
# false alarm, and the false-alarm rate is what decides whether a compliance
# team keeps the checker switched on. A defect class that is under-covered
# costs you recall you can measure later; a clean class that is too small or
# too easy hides the one number nobody can recover afterwards.
#
# The set is deliberately mixed: one-line answers, long reasoned ones,
# answers with no checkable facts at all, and answers whose numbers and
# dates are correct but rendered differently from the evidence.
#
# Authored blind, before the pack's rule bodies were read.

- id: eurb-frozen-clean-001
  defect_class: clean
  surface_form_distance: identical
  note: The shortest possible correct answer, quoted straight from the source.
  answer: The annual interest rate is 3,9 %.
  evidence:
    - id: tariff-2026#p1
      text: >-
        Personal loan tariff, edition 2026. The annual interest rate is 3,9 %.
        The rate is fixed for the whole term of the loan.
  metadata:
    product_type: personal_loan
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

