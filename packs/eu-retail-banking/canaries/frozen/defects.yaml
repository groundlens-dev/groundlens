# ── polarity_flip ───────────────────────────────────────────────────────────

- id: eurb-frozen-polarity-flip-001
  defect_class: polarity_flip
  surface_form_distance: identical
  note: >-
    must_not becoming may. The evidence prohibits; the answer permits. This
    is the arm that lets a customer do the forbidden thing.
  answer: You may use this account for business payments.
  evidence:
    - id: personal-account-terms#p2
      text: >-
        The account must not be used for business payments. It is provided for
        personal use only.
  metadata:
    product_type: current_account
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - fact.contradicted.obligation

- id: eurb-frozen-polarity-flip-002
  defect_class: polarity_flip
  surface_form_distance: paraphrased
  note: >-
    may becoming must. The evidence permits with approval; the answer states
    a duty that does not exist. BNK-020 in the contract: obligation strength
    must not exceed the evidence.
  answer: You must exceed the agreed limit only after obtaining prior approval.
  evidence:
    - id: overdraft-terms#p3
      text: >-
        Customers may exceed the agreed limit with prior approval. Approval is
        given in writing and may be withdrawn.
  metadata:
    product_type: current_account
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - fact.contradicted.obligation

- id: eurb-frozen-polarity-flip-003
  defect_class: polarity_flip
  surface_form_distance: identical
  note: >-
    The contract's own worked example, kept verbatim so that a regression in
    the obligation wedge shows up here first.
  answer: You must not exceed the limit.
  evidence:
    - id: overdraft-terms#p3
      text: Customers may exceed the limit with prior approval.
  metadata:
    product_type: current_account
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - fact.contradicted.obligation

- id: eurb-frozen-polarity-flip-004
  defect_class: polarity_flip
  surface_form_distance: restructured
  note: >-
    must becoming may, inside a longer answer where the rest is correct. A
    reviewer reading quickly would miss this one, which is precisely the case
    a checker earns its place on.
  answer: >-
    Two things to note about the documents.

    First, you may send us proof of address before the account is opened.

    Second, the monthly maintenance charge is EUR 3,00.
  evidence:
    - id: onboarding#p1
      text: >-
        The customer must send proof of address before the account is opened.
        The account is not opened until the proof has been received.
    - id: account-terms#p3
      text: The monthly maintenance charge is 3,00 EUR.
  metadata:
    product_type: current_account
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - fact.contradicted.obligation

