# Defective answers, one document per defect class group.
#
# Authored blind, from the defect-class definitions and the frozen interface
# contract, before the pack's rule bodies were read. Where the contract pins
# the behaviour (section 3's finding codes, and rules BNK-001/014/020/031,
# which the contract reproduces in full) a code is asserted. Where it does
# not, only the decision is asserted, because guessing at an implementation
# detail and then calling the guess an expectation is how a canary suite
# turns into a mirror of the code it is supposed to audit.

# ── wrong_number ────────────────────────────────────────────────────────────

- id: eurb-frozen-wrong-number-001
  defect_class: wrong_number
  surface_form_distance: identical
  note: A rate substituted for a different one. The evidence says 3,9; the answer says 4,9.
  answer: The annual interest rate is 4,9 %.
  evidence:
    - id: tariff-2026#p1
      text: >-
        Personal loan tariff, edition 2026. The annual interest rate is 3,9 %.
        The rate is fixed for the whole term of the loan.
  metadata:
    product_type: personal_loan
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate

- id: eurb-frozen-wrong-number-002
  defect_class: wrong_number
  surface_form_distance: paraphrased
  note: >-
    A count invented outright. The evidence gives three years; the answer
    says five, in a sentence that is otherwise a fair paraphrase.
  answer: >-
    An early repayment charge of 1 % applies for the first five years of the
    loan, and nothing after that.
  evidence:
    - id: mortgage-tariff#p3
      text: >-
        Early repayment charge: 1 % of the amount repaid during the first
        three years of the loan. No early repayment charge applies after the
        third year.
  metadata:
    product_type: mortgage
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate

- id: eurb-frozen-wrong-number-003
  defect_class: wrong_number
  surface_form_distance: restructured
  note: >-
    Correct figures for two of three items and a wrong one for the third,
    presented as a list where the evidence was prose. The defect is the
    12,5 becoming 2,5.
  answer: >-
    Summary of the charges:

    1. Monthly maintenance: EUR 3,00.
    2. Overdraft rate: 2,5 % a year.
    3. Cash withdrawals at our own machines: free.
  evidence:
    - id: account-terms#p1
      text: Cash withdrawals at the bank's own machines are free of charge.
    - id: account-terms#p2
      text: >-
        The overdraft rate is 12,5 % a year, applied to the balance actually
        overdrawn.
    - id: account-terms#p3
      text: The monthly maintenance charge is 3,00 EUR.
  metadata:
    product_type: current_account
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate

