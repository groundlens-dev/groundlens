- id: eurb-dev-clean-006
  defect_class: clean
  surface_form_distance: paraphrased
  note: >-
    A long reasoned answer carrying several correct figures. This is the case
    most likely to be tripped by a rule written for a different length of
    text, so it is the one to watch.
  answer: >-
    Based on the documents you sent, the mortgage you are asking about carries
    an annual interest rate of 2,75 % fixed for the first five years, after
    which it moves to the variable rate described in the tariff. The valuation
    fee is EUR 400,00 and is payable whether or not the application proceeds.
    The early repayment charge is 1 % of the amount repaid in the first three
    years and nothing after that.

    We recommend that you compare these terms against at least one other offer
    before deciding, and that you read the binding offer in full when it is
    issued.

    This information does not constitute advice and does not take account of
    your circumstances. The final terms are those stated in the binding offer.
  evidence:
    - id: mortgage-tariff#p1
      text: >-
        Fixed-to-variable mortgage. Annual interest rate 2,75 % fixed for the
        first five years. Thereafter the variable rate in the current tariff
        applies.
    - id: mortgage-tariff#p2
      text: >-
        Valuation fee 400,00 EUR. The valuation fee is payable whether or not
        the application proceeds to completion.
    - id: mortgage-tariff#p3
      text: >-
        Early repayment charge 1 % of the amount repaid during the first three
        years of the loan. No early repayment charge applies after the third
        year.
  metadata:
    product_type: mortgage
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

