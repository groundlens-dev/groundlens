# Clean answers for the eu-retail-banking dev suite.
#
# Authored after reading the pack, which is what dev/ is for. The difference
# from frozen/ is one line: every answer here carries the verbatim disclosure
# sentence that BNK-031's predicate accepts.
#
# That single line is worth stating plainly, because it is the whole result of
# this exercise. BNK-031 is severity fail and its predicate matches four fixed
# strings. An answer without one of those strings escalates no matter how well
# grounded it is. So the clean class splits in two:
#
#   frozen/  clean answers written the way a customer-facing generator would
#            actually write them  ->  every one of them escalates
#   dev/     the same answers with the disclosure sentence pasted in
#            ->  they clear
#
# Neither suite is wrong. They measure two different deployments, and the gap
# between them is the cost of requiring boilerplate in a fail-severity rule.
#
# The clean class is the largest class in this suite, on purpose. It is the
# only place the false-alarm rate can be seen.

- id: eurb-dev-clean-001
  defect_class: clean
  surface_form_distance: identical
  note: Shortest correct answer that satisfies the pack as written.
  answer: >-
    The annual interest rate is 3,9 %. This information does not constitute
    advice.
  evidence:
    - id: tariff-2026#p1
      text: >-
        Personal loan tariff, edition 2026. The annual interest rate is 3,9 %.
        The rate is fixed for the whole term of the loan.
  metadata:
    product_type: personal_loan
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: clear
    must_include_codes: []

