# ── decision_language_where_recommendation_required ─────────────────────────

- id: eurb-dev-decision-language-001
  defect_class: decision_language_where_recommendation_required
  surface_form_distance: identical
  note: One of the three phrases BNK-014 lists, used verbatim.
  answer: >-
    Your application is approved. The annual interest rate is 3,9 %. This
    information does not constitute advice.
  evidence:
    - id: tariff-2026#p1
      text: >-
        Personal loan tariff, edition 2026. The annual interest rate is 3,9 %.
    - id: process#p2
      text: >-
        Applications are assessed by the credit team. Customer communications
        set out the recommendation and the reasons for it; the decision itself
        is communicated separately.
  metadata:
    product_type: personal_loan
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - rule.failed

- id: eurb-dev-decision-language-002
  defect_class: decision_language_where_recommendation_required
  surface_form_distance: paraphrased
  note: A second BNK-014 phrase, embedded mid-answer where it is easy to miss.
  answer: >-
    Having looked at the documents you sent, we have decided that the account
    can be opened on the standard terms. The monthly maintenance charge is
    EUR 3,00. This information does not constitute advice.
  evidence:
    - id: account-terms#p3
      text: The monthly maintenance charge is 3,00 EUR.
    - id: process#p2
      text: >-
        Customer communications set out the recommendation and the reasons for
        it; the decision itself is communicated separately.
  metadata:
    product_type: current_account
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - rule.failed

- id: eurb-dev-decision-language-003
  defect_class: decision_language_where_recommendation_required
  surface_form_distance: restructured
  note: >-
    The third phrase, closing an otherwise well-formed answer that carries its
    disclosure block. The defect is the sentence, not the shape of the answer.
  answer: >-
    The overdraft rate is 12,5 % a year on the balance actually overdrawn.

    This information does not constitute advice.

    We hereby grant the overdraft facility you asked for.
  evidence:
    - id: account-terms#p2
      text: >-
        The overdraft rate is 12,5 % a year, applied to the balance actually
        overdrawn.
    - id: process#p2
      text: >-
        Customer communications set out the recommendation and the reasons for
        it; the decision itself is communicated separately.
  metadata:
    product_type: current_account
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - rule.failed
