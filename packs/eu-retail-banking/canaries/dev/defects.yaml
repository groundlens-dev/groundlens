# Defective answers for the eu-retail-banking dev suite.
#
# Every case here carries the verbatim disclosure sentence, except the
# missing_disclosure cases where its absence is the defect. That is deliberate
# and it is the point of the file: if the defect cases were also missing the
# disclosure they would all escalate on BNK-031 regardless of their actual
# defect, and the recall column would report a number that had nothing to do
# with the defect it claims to be measuring.
#
# A canary that passes for the wrong reason is worse than one that fails.

# ── wrong_number ────────────────────────────────────────────────────────────

- id: eurb-dev-wrong-number-001
  defect_class: wrong_number
  surface_form_distance: identical
  note: The rate substituted. Evidence says 3,9 %; the answer says 4,9 %.
  answer: >-
    The annual interest rate is 4,9 %. This information does not constitute
    advice.
  evidence:
    - id: tariff-2026#p1
      text: >-
        Personal loan tariff, edition 2026. The annual interest rate is 3,9 %.
        The rate is fixed for the whole term of the loan.
  metadata:
    product_type: personal_loan
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - fact.contradicted.percent

- id: eurb-dev-wrong-number-002
  defect_class: wrong_number
  surface_form_distance: paraphrased
  note: Three years becoming five, in an otherwise fair paraphrase.
  answer: >-
    An early repayment charge of 1 % applies for the first five years of the
    loan, and nothing after that. This information does not constitute advice.
  evidence:
    - id: mortgage-tariff#p3
      text: >-
        Early repayment charge 1 % of the amount repaid during the first three
        years of the loan. No early repayment charge applies after the third
        year.
  metadata:
    product_type: mortgage
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - fact.contradicted.number

- id: eurb-dev-wrong-number-003
  defect_class: wrong_number
  surface_form_distance: restructured
  note: Two of three figures right; the overdraft rate 12,5 becomes 2,5.
  answer: >-
    Summary of the charges.

    1. Monthly maintenance EUR 3,00.
    2. Overdraft rate 2,5 % a year.
    3. Cash withdrawals at our own machines are free.

    This information does not constitute advice.
  evidence:
    - id: account-terms#p1
      text: Cash withdrawals at the bank's own machines are free of charge.
    - id: account-terms#p2
      text: >-
        The overdraft rate is 12,5 % a year, applied to the balance actually
        overdrawn.
    - id: account-terms#p3
      text: The monthly maintenance charge is 3,00 EUR.
  metadata:
    product_type: current_account
    disclosure_set: es-2026
  reference_date: "2026-08-08"
  expect:
    decision: escalate
    must_include_codes:
      - fact.contradicted.percent

