# Locks the MCP server this plugin starts (`uvx --from groundlens[mcp]==6.0.5 groundlens mcp`)
# to exact versions, sources and hashes. Regenerate with `uv lock` after raising the pin.
[project]
name = "groundlens-plugin"
version = "1.0.0"
description = "Dependencies of the GroundLens MCP server started by the GroundLens plugin."
requires-python = ">=3.10"
dependencies = ["groundlens[mcp]==6.0.5"]

[tool.uv]
package = false
