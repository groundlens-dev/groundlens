# Value extraction, English.
#
# Each case: text plus the facts that must be present.  `exact: true` means the
# listed facts are the complete expected output, in order.
# Fields on an expected fact: kind, raw, normalised, attrs (subset), ambiguity.

- id: us-thousands-separator
  locale: en-us
  reference_date: "2026-02-10"
  text: "The arrangement fee is $1,000."
  exact: true
  expect:
    - kind: currency
      raw: "$1,000"
      normalised: "USD 1000"

- id: us-decimal-and-thousands
  locale: en-us
  reference_date: "2026-02-10"
  text: "Total due: $1,250.50 payable on receipt."
  expect:
    - kind: currency
      raw: "$1,250.50"
      normalised: "USD 1250.5"
      attrs: {currency: "USD"}

- id: us-currency-word-after-amount
  locale: en-us
  reference_date: "2026-02-10"
  text: "It costs 25 dollars."
  expect:
    - kind: currency
      raw: "25 dollars"
      normalised: "USD 25"

- id: gb-dollar-is-not-a-pound
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The penalty is $500."
  expect:
    - kind: currency
      raw: "$500"
      normalised: "$ 500"
      ambiguity: ["currency_symbol_ambiguous"]

- id: us-scale-word
  locale: en-us
  reference_date: "2026-02-10"
  text: "Revenue was $3.5 million last year."
  expect:
    - kind: currency
      raw: "$3.5 million"
      normalised: "USD 3500000"
      attrs: {multiplier: "million"}

- id: percent-and-points-are-different
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The rate is 12.5% after a rise of 2 percentage points."
  expect:
    - kind: percent
      raw: "12.5%"
      normalised: "12.5%"
    - kind: percent
      raw: "2 percentage points"
      normalised: "2pp"

- id: percent-spelled-out
  locale: en-gb
  reference_date: "2026-02-10"
  text: "A charge of 4 per cent applies."
  expect:
    - kind: percent
      raw: "4 per cent"
      normalised: "4%"

- id: iso-date
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The report was filed on 2026-03-03."
  expect:
    - kind: date
      raw: "2026-03-03"
      normalised: "2026-03-03"

- id: textual-date-dmy
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The report was filed on 3 March 2026."
  expect:
    - kind: date
      raw: "3 March 2026"
      normalised: "2026-03-03"

- id: textual-date-mdy
  locale: en-us
  reference_date: "2026-02-10"
  text: "The report was filed on March 3, 2026."
  expect:
    - kind: date
      raw: "March 3, 2026"
      normalised: "2026-03-03"

- id: numeric-date-unambiguous-under-dmy
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Filed on 03/03/2026."
  expect:
    - kind: date
      raw: "03/03/2026"
      normalised: "2026-03-03"

- id: numeric-date-ambiguous-dmy
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Filed on 03/04/2026."
  expect:
    - kind: date
      raw: "03/04/2026"
      normalised: "2026-04-03"
      attrs: {date_ambiguous: "true", date_order: "DMY"}
      ambiguity: ["date_order_ambiguous"]

- id: numeric-date-ambiguous-mdy
  locale: en-us
  reference_date: "2026-02-10"
  text: "Filed on 03/04/2026."
  expect:
    - kind: date
      raw: "03/04/2026"
      normalised: "2026-03-04"
      attrs: {date_ambiguous: "true", date_order: "MDY"}
      ambiguity: ["date_order_ambiguous"]

- id: month-word-that-is-also-a-modal
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The controller may 5 days later request an extension."
  forbid:
    - kind: date

- id: duration-days
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Retention lasts 30 days."
  expect:
    - kind: duration
      raw: "30 days"
      normalised: "P30D"

- id: duration-weeks-become-days
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Retention lasts 2 weeks."
  expect:
    - kind: duration
      raw: "2 weeks"
      normalised: "P14D"

- id: duration-business-days-are-distinct
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Retention lasts 30 business days."
  expect:
    - kind: duration
      raw: "30 business days"
      normalised: "P30D"
      attrs: {day_basis: "business"}

- id: duration-compound
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The term is 1 year and 6 months."
  expect:
    - kind: duration
      raw: "1 year and 6 months"
      normalised: "P1Y6M"

- id: deadline-relative-resolves-against-reference-date
  locale: en-gb
  reference_date: "2026-02-10"
  text: "You must reply within 30 days."
  expect:
    - kind: deadline
      raw: "within 30 days"
      normalised: "2026-03-12"
      attrs: {anchor: "reference_date", due_date: "2026-03-12", duration: "P30D"}

- id: deadline-anchored-to-an-event-stays-a-duration
  locale: en-gb
  reference_date: "2026-02-10"
  text: "You must reply within 30 days of receipt."
  expect:
    - kind: deadline
      raw: "within 30 days of receipt"
      normalised: "P30D"
      attrs: {anchor: "event"}

- id: deadline-business-days-not-resolved
  locale: en-gb
  reference_date: "2026-02-10"
  text: "You must reply within 10 business days."
  expect:
    - kind: deadline
      raw: "within 10 business days"
      normalised: "P10D"
      attrs: {unresolved_reason: "business_days"}

- id: deadline-explicit-date
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Submit no later than 3 March 2026."
  expect:
    - kind: deadline
      raw: "no later than 3 March 2026"
      normalised: "2026-03-03"

- id: deadline-year-inferred-forward
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Submit no later than 3 March."
  expect:
    - kind: deadline
      raw: "no later than 3 March"
      normalised: "2026-03-03"
      attrs: {year_inferred: "true"}

- id: deadline-end-of-quarter
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Submit by the end of the quarter."
  expect:
    - kind: deadline
      raw: "by the end of the quarter"
      normalised: "2026-03-31"
      attrs: {period: "quarter"}

- id: deadline-end-of-next-month
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Submit by the end of next month."
  expect:
    - kind: deadline
      raw: "by the end of next month"
      normalised: "2026-03-31"

- id: citations-mixed
  locale: en-gb
  reference_date: "2026-02-10"
  text: "See Article 12, §4.2, Reg. (EU) 2016/679, EBA/GL/2020/06 and [3]."
  expect:
    - kind: citation
      raw: "Article 12"
      normalised: "ARTICLE 12"
    - kind: citation
      raw: "§4.2"
      normalised: "SECTION 4.2"
    - kind: citation
      raw: "Reg. (EU) 2016/679"
      normalised: "REGULATION (EU) 2016/679"
    - kind: citation
      raw: "EBA/GL/2020/06"
      normalised: "EBA/GL/2020/06"
    - kind: citation
      raw: "[3]"
      normalised: "REF 3"

- id: citation-numbers-are-not-also-numbers
  locale: en-gb
  reference_date: "2026-02-10"
  text: "See Article 12."
  exact: true
  expect:
    - kind: citation
      raw: "Article 12"
      normalised: "ARTICLE 12"

- id: negative-number
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The adjustment was -3.25 units."
  expect:
    - kind: number
      raw: "-3.25"
      normalised: "-3.25"
