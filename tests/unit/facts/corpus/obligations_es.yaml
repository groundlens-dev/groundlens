# Obligation polarity, Spanish.  The negation is a separate word from the modal
# in Spanish ("no debe"), which makes the single-cue rule even more important:
# a naive "debe" match would report an obligation where the source prohibits.

- id: es-debe
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad debe conservar los registros."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must", operator: "debe"}

- id: es-debera
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad deberá conservar los registros."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must"}

- id: es-esta-obligado-a
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad está obligada a conservar los registros."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must"}

- id: es-tiene-que
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad tiene que conservar los registros."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must"}

- id: es-no-debe-is-a-prohibition
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad no debe divulgar los registros."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not", operator: "no debe"}

- id: es-no-podra
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad no podrá divulgar los registros."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

- id: es-queda-prohibido
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Queda prohibido divulgar los registros a terceros."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

- id: es-se-prohibe
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Se prohíbe divulgar los registros a terceros."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

- id: es-ninguno-podra
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Ningún empleado podrá divulgar los registros."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

- id: es-puede
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad puede cobrar una comisión de administración."
  expect:
    - kind: obligation
      normalised: "may"
      attrs: {polarity: "may", operator: "puede"}

- id: es-tiene-derecho-a
  locale: eu-es
  reference_date: "2026-02-10"
  text: "El cliente tiene derecho a una copia del expediente."
  expect:
    - kind: obligation
      normalised: "may"
      attrs: {polarity: "may"}

- id: es-no-esta-obligado-a
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad no está obligada a conservar los registros."
  expect:
    - kind: obligation
      normalised: "need_not"
      attrs: {polarity: "need_not"}

- id: es-esta-exento-de
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad está exenta de la obligación de informar."
  expect:
    - kind: obligation
      normalised: "need_not"
      attrs: {polarity: "need_not"}

- id: es-no-es-necesario
  locale: eu-es
  reference_date: "2026-02-10"
  text: "No es necesario conservar los registros más de un año."
  expect:
    - kind: obligation
      normalised: "need_not"
      attrs: {polarity: "need_not"}

- id: es-deberia-is-a-recommendation
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad debería revisar la política cada año."
  expect:
    - kind: obligation
      normalised: "should"
      attrs: {polarity: "should"}

- id: es-se-recomienda
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Se recomienda revisar la política cada año."
  expect:
    - kind: obligation
      normalised: "should"
      attrs: {polarity: "should"}

- id: es-no-deberia-keeps-the-negation
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad no debería publicar la nota interna."
  expect:
    - kind: obligation
      normalised: "should:negative"
      attrs: {polarity: "should", direction: "negative"}

- id: es-conditional-si
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Si la cuenta se cancela, la entidad debe informar al cliente."
  expect:
    - kind: obligation
      normalised: "must"
      attrs:
        conditional: "true"
        condition_kind: "si"
        condition: "Si la cuenta se cancela"

- id: es-conditional-salvo-que
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad debe informar al cliente salvo que el cliente se oponga."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {conditional: "true", condition_kind: "salvo_que"}

- id: es-obligation-with-deadline
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La entidad deberá notificar al cliente en un plazo de 30 días."
  expect:
    - kind: obligation
      normalised: "must"
    - kind: deadline
      normalised: "2026-03-12"

- id: es-ni-ni-is-a-prohibition
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Ni la entidad ni el agente podrán divulgar los datos."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}
