# Obligation polarity, English.  Every form listed in the v1 scope, plus the
# negation-scope and conditional-modality cases that decide whether the wedge
# is trustworthy.
#
# Read the polarity column as the claim the finding will make to a reviewer.
# A wrong entry here inverts the meaning of a regulatory statement.

# -- MUST --------------------------------------------------------------------

- id: must-modal
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must retain the records."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must", operator: "must"}

- id: must-shall
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm shall retain the records."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must", operator: "shall"}

- id: must-is-required-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm is required to retain the records."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must", operator: "is required to"}

- id: must-has-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm has to retain the records."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must", operator: "has to"}

- id: must-is-obliged-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm is obliged to retain the records."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {polarity: "must"}

# -- MUST NOT ----------------------------------------------------------------

- id: must-not-is-not-must-plus-negation
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must not disclose the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not", operator: "must not"}

- id: shall-not
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm shall not disclose the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not", operator: "shall not"}

- id: may-not-is-prohibition-not-permission
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm may not disclose the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not", operator: "may not"}

- id: is-prohibited-from
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm is prohibited from disclosing the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

- id: must-never
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must never disclose the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not", operator: "must never"}

- id: adverb-between-modal-and-negator
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must knowingly not disclose the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

- id: sentential-negation-before-the-modal
  locale: en-gb
  reference_date: "2026-02-10"
  text: "No employee may disclose the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not", operator: "No employee may"}

- id: is-required-not-to-is-a-prohibition
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm is required not to disclose the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

- id: contraction
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm mustn't disclose the records."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

# -- MAY ---------------------------------------------------------------------

- id: may-permission
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm may charge an administration fee."
  expect:
    - kind: obligation
      normalised: "may"
      attrs: {polarity: "may", operator: "may"}

- id: is-permitted-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm is permitted to charge an administration fee."
  expect:
    - kind: obligation
      normalised: "may"
      attrs: {polarity: "may"}

- id: can-is-a-weak-permission-cue
  locale: en-gb
  reference_date: "2026-02-10"
  text: "You can request a copy of the file."
  expect:
    - kind: obligation
      normalised: "may"
      attrs: {polarity: "may", cue_strength: "weak"}

- id: is-entitled-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The customer is entitled to a refund."
  expect:
    - kind: obligation
      normalised: "may"
      attrs: {polarity: "may"}

