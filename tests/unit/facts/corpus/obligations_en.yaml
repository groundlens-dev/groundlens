- id: need-not
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm need not retain the records."
  expect:
    - kind: obligation
      normalised: "need_not"
      attrs: {polarity: "need_not", operator: "need not"}

- id: is-not-required-to-is-not-a-prohibition
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm is not required to retain the records."
  expect:
    - kind: obligation
      normalised: "need_not"
      attrs: {polarity: "need_not", operator: "is not required to"}

- id: is-exempt-from
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm is exempt from the reporting requirement."
  expect:
    - kind: obligation
      normalised: "need_not"
      attrs: {polarity: "need_not"}

- id: has-no-obligation-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm has no obligation to retain the records."
  expect:
    - kind: obligation
      normalised: "need_not"
      attrs: {polarity: "need_not"}

- id: does-not-need-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm does not need to retain the records."
  expect:
    - kind: obligation
      normalised: "need_not"
      attrs: {polarity: "need_not"}

# -- SHOULD ------------------------------------------------------------------

- id: should
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm should review the policy annually."
  expect:
    - kind: obligation
      normalised: "should"
      attrs: {polarity: "should", operator: "should"}

- id: is-recommended-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm is recommended to review the policy annually."
  expect:
    - kind: obligation
      normalised: "should"
      attrs: {polarity: "should"}

- id: should-not-keeps-the-negation-without-inventing-a-prohibition
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm should not publish the internal note."
  expect:
    - kind: obligation
      normalised: "should:negative"
      attrs: {polarity: "should", direction: "negative"}

- id: ought-not-to
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm ought not to publish the internal note."
  expect:
    - kind: obligation
      normalised: "should:negative"
      attrs: {polarity: "should", direction: "negative"}

# -- conditional modality ----------------------------------------------------

- id: conditional-before-the-modal
  locale: en-gb
  reference_date: "2026-02-10"
  text: "If the account is closed, the firm must notify the customer."
  expect:
    - kind: obligation
      normalised: "must"
      attrs:
        polarity: "must"
        conditional: "true"
        condition_kind: "if"
        condition_position: "before"
        condition: "If the account is closed"

- id: conditional-after-the-modal
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must notify the customer unless the customer has objected."
  expect:
    - kind: obligation
      normalised: "must"
      attrs:
        polarity: "must"
        conditional: "true"
        condition_kind: "unless"
        condition_position: "after"
        condition: "unless the customer has objected"

- id: parenthetical-condition
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must, unless the customer objects, publish the notice."
  expect:
    - kind: obligation
      normalised: "must"
      attrs:
        conditional: "true"
        condition_kind: "unless"
        condition: "unless the customer objects"

- id: conditional-where
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Where the customer is a consumer, the firm shall provide the summary."
  expect:
    - kind: obligation
      normalised: "must"
      attrs: {conditional: "true", condition_kind: "where"}

- id: unconditional-obligation-carries-no-condition
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must notify the customer."
  forbid_attrs: ["conditional"]

# -- scope the extractor refuses to resolve ----------------------------------

- id: nothing-in-this-article-is-flagged-not-guessed
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Nothing in this Article shall prevent the firm from charging a fee."
  expect:
    - kind: obligation
      attrs: {scope_uncertain: "true"}

- id: double-negation-is-flagged
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm shall not be prohibited from charging a fee."
  expect:
    - kind: obligation
      attrs: {scope_uncertain: "true", scope_reason: "double_negation"}

- id: may-not-be-required-to-is-flagged
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm may not be required to publish the notice."
  expect:
    - kind: obligation
      attrs: {scope_uncertain: "true"}

# -- clause span -------------------------------------------------------------

- id: clause-stops-at-the-sentence
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must retain the records. The customer may request a copy."
  expect:
    - kind: obligation
      raw: "The firm must retain the records"
      normalised: "must"
    - kind: obligation
      raw: "The customer may request a copy"
      normalised: "may"

- id: two-polarities-in-one-sentence
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must retain the records, and the firm may not disclose them."
  expect:
    - kind: obligation
      normalised: "must"
    - kind: obligation
      normalised: "must_not"

- id: neither-nor-is-a-prohibition-not-a-permission
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Neither the firm nor the agent may disclose the data."
  expect:
    - kind: obligation
      normalised: "must_not"
      attrs: {polarity: "must_not"}

- id: an-elliptical-negative-clause-is-dropped-not-inverted
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The firm must file the report; the agent may not."
  expect:
    - kind: obligation
      normalised: "must"
  forbid_normalised: ["may"]

- id: a-question-about-a-duty-is-not-a-duty
  locale: en-gb
  reference_date: "2026-02-10"
  text: "Must the firm file the report?"
  expect:
    - kind: obligation
      attrs: {scope_uncertain: "true", scope_reason: "interrogative"}

- id: an-embedded-question-is-flagged
  locale: en-gb
  reference_date: "2026-02-10"
  text: "It is unclear whether the firm must file the report."
  expect:
    - kind: obligation
      attrs: {scope_uncertain: "true"}

- id: reported-guidance-is-still-an-obligation
  locale: en-gb
  reference_date: "2026-02-10"
  text: "The guidance states that the firm must file the report."
  expect:
    - kind: obligation
      normalised: "must"
  forbid_attrs: ["scope_uncertain"]
