# Value extraction, Spanish, European separators.

- id: eu-group-separator-is-a-dot
  locale: eu-es
  reference_date: "2026-02-10"
  text: "El importe es de 1.000 EUR."
  expect:
    - kind: currency
      raw: "1.000 EUR"
      normalised: "EUR 1000"

- id: eu-comma-with-three-digits-on-money-is-a-group
  locale: eu-es
  reference_date: "2026-02-10"
  text: "El importe es de 1,000 EUR."
  expect:
    - kind: currency
      raw: "1,000 EUR"
      normalised: "EUR 1000"
      ambiguity: ["grouping_vs_decimal"]

- id: eu-space-group-and-comma-decimal
  locale: eu-es
  reference_date: "2026-02-10"
  text: "El importe es 1 000,00 EUR."
  expect:
    - kind: currency
      raw: "1 000,00 EUR"
      normalised: "EUR 1000"

- id: eu-symbol-after-amount
  locale: eu-es
  reference_date: "2026-02-10"
  text: "El importe es 1000€."
  expect:
    - kind: currency
      raw: "1000€"
      normalised: "EUR 1000"

- id: eu-decimal-comma-two-places
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Son 1.500,75 euros en total."
  expect:
    - kind: currency
      raw: "1.500,75 euros"
      normalised: "EUR 1500.75"

- id: eu-dollar-word-under-euro-profile-is-ambiguous
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Cuesta 25 dólares."
  expect:
    - kind: currency
      raw: "25 dólares"
      normalised: "DÓLARES 25"
      ambiguity: ["currency_word_ambiguous"]

- id: eu-percent-with-comma
  locale: eu-es
  reference_date: "2026-02-10"
  text: "La comisión es del 2,5 %."
  expect:
    - kind: percent
      raw: "2,5 %"
      normalised: "2.5%"

- id: eu-percent-spelled-out
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Un recargo del 4 por ciento."
  expect:
    - kind: percent
      raw: "4 por ciento"
      normalised: "4%"

- id: eu-textual-date
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Se presentó el 3 de marzo de 2026."
  expect:
    - kind: date
      raw: "3 de marzo de 2026"
      normalised: "2026-03-03"

- id: eu-numeric-date-dmy
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Se presentó el 03/04/2026."
  expect:
    - kind: date
      raw: "03/04/2026"
      normalised: "2026-04-03"
      attrs: {date_ambiguous: "true", date_order: "DMY"}

- id: eu-duration-days
  locale: eu-es
  reference_date: "2026-02-10"
  text: "El plazo de conservación es de 30 días."
  expect:
    - kind: duration
      raw: "30 días"
      normalised: "P30D"

- id: eu-duration-business-days
  locale: eu-es
  reference_date: "2026-02-10"
  text: "El plazo es de 10 días hábiles."
  expect:
    - kind: duration
      raw: "10 días hábiles"
      normalised: "P10D"
      attrs: {day_basis: "business"}

- id: eu-deadline-plazo
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Debe responder en un plazo de 30 días."
  expect:
    - kind: deadline
      raw: "en un plazo de 30 días"
      normalised: "2026-03-12"
      attrs: {anchor: "reference_date", duration: "P30D"}

- id: eu-deadline-a-mas-tardar
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Debe presentarlo a más tardar el 3 de marzo de 2026."
  expect:
    - kind: deadline
      raw: "a más tardar el 3 de marzo de 2026"
      normalised: "2026-03-03"

- id: eu-citation-articulo
  locale: eu-es
  reference_date: "2026-02-10"
  text: "Véase el artículo 12 del Reglamento (UE) 2016/679."
  expect:
    - kind: citation
      raw: "artículo 12"
      normalised: "ARTICLE 12"
    - kind: citation
      raw: "Reglamento (UE) 2016/679"
      normalised: "REGULATION (EU) 2016/679"
