[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundlens"
version = "3.0.0"
description = "Shows you which words in an answer your sources don't support, and what each one lost to."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Javier Marin" }]
keywords = ["rag", "grounding", "hallucination", "evidence", "review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

# The core package has NO runtime dependencies. Not numpy, not torch.
# `pip install groundlens` must never pull a deep learning stack.
dependencies = []

[project.optional-dependencies]
# The reference encoder. Only needed to actually score text.
encoder = ["sentence-transformers>=3.0", "numpy>=1.24"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
groundlens = "groundlens.cli:main"

[project.urls]
Homepage = "https://groundlens.dev"
Source = "https://github.com/groundlens-dev/groundlens"

[tool.hatch.build.targets.wheel]
packages = ["src/groundlens"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PL"]
# RUF001/002/003: this library exists to handle U+00A0, U+202F, U+2212 and friends
# as first-class data. Flagging them as "ambiguous" is exactly backwards here.
ignore = ["ANN401", "PLR0913", "RUF001", "RUF002", "RUF003", "PLR2004", "SIM905", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "PLC0415", "E501", "S101", "S603"]
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
